name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract release notes for tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          NOTES_FILE="docs/release_notes/${TAG}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "::error::Release notes not found: $NOTES_FILE"
            exit 1
          fi
          cp "$NOTES_FILE" /tmp/release_notes.md

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Package source
        run: bash scripts/package-source.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          PRERELEASE_FLAG=()
          if [[ "$TAG" == *-preview ]]; then
            PRERELEASE_FLAG=(--prerelease)
          fi
          gh release create "$TAG" \
            "${PRERELEASE_FLAG[@]}" \
            --title "$TAG" \
            --notes-file /tmp/release_notes.md \
            target/dist/*

  # After the GitHub Release exists, mirror every branch/tag to GitCode and
  # publish the matching Release there. The GitCode Release carries the same
  # title / prerelease state / assets as GitHub, but uses the Chinese release
  # notes. GITCODE_TOKEN is an environment secret, so the job must declare the
  # environment to read it.
  mirror:
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: GITCODE_TOKEN
    env:
      MIRROR_REPO: ZheFeng7/boost-module
      MIRROR_URL: https://gitcode.com/ZheFeng7/boost-module.git
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      # Disable the CLI's background npm update check (CI is already non-interactive).
      GC_NO_UPDATE_CHECK: "1"

    steps:
      - name: Checkout (all history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract Chinese release notes for tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          NOTES_FILE="docs/zh/release_notes/${TAG}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "::error::Chinese release notes not found: $NOTES_FILE"
            exit 1
          fi
          cp "$NOTES_FILE" /tmp/release_notes_zh.md

      - name: Install GitCode CLI
        run: |
          set -euo pipefail
          GC_DIR="$RUNNER_TEMP/gc-cli"
          mkdir -p "$GC_DIR"
          cd "$GC_DIR"
          npm init -y >/dev/null
          npm install --no-save --ignore-scripts atomgit-cli@0.14.0
          echo "$GC_DIR/node_modules/.bin" >> "$GITHUB_PATH"
          "$GC_DIR/node_modules/.bin/gitcode" version

      - name: Download release assets from GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p target/dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir target/dist --clobber
          ls -l target/dist

      - name: Force-sync all branches and tags to GitCode mirror
        run: |
          set -euo pipefail
          # Make sure every branch/tag exists locally (as a remote-tracking ref for
          # branches), then force-mirror them. Deleting origin/HEAD stops the
          # wildcard refspec from creating a bogus refs/heads/HEAD on the mirror.
          git fetch --prune --force origin \
            "+refs/heads/*:refs/remotes/origin/*" \
            "+refs/tags/*:refs/tags/*"
          git update-ref -d refs/remotes/origin/HEAD || true

          # GitCode's git-over-HTTPS endpoint rejects Bearer tokens; it wants HTTP
          # Basic with user `oauth2` and the PAT as password (unlike the REST API).
          AUTH="$(printf 'oauth2:%s' "$GITCODE_TOKEN" | base64 -w0)"
          git -c "http.https://gitcode.com/.extraHeader=Authorization: Basic ${AUTH}" \
            push --force --prune "$MIRROR_URL" \
            "+refs/remotes/origin/*:refs/heads/*" \
            "+refs/tags/*:refs/tags/*"

      - name: Create GitCode Release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PRERELEASE_FLAG=()
          if [[ "$TAG" == *-preview ]]; then
            PRERELEASE_FLAG=(--prerelease)
          fi
          gitcode --no-interactive release create "$TAG" \
            "${PRERELEASE_FLAG[@]}" \
            -R "$MIRROR_REPO" \
            --title "$TAG" \
            --notes-file /tmp/release_notes_zh.md

      - name: Upload release assets to GitCode Release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gitcode --no-interactive release upload "$TAG" target/dist/* -R "$MIRROR_REPO"

  # After both the GitHub Release and the GitCode mirror release exist, register
  # the new version in the mcpp-index descriptor and open a PR upstream. The
  # branch is pushed to the fork (ZheFeng7110/mcpp-index) and the PR targets the
  # upstream (mcpplibs/mcpp-index). Cross-repository write + PR creation cannot
  # use GITHUB_TOKEN, hence the dedicated PAT secret. Preview tags are skipped:
  # the public index only carries stable releases.
  publish-index:
    needs: [release, mirror]
    if: ${{ !contains(github.ref_name, '-preview') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release archive from GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p target/dist
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.tar.xz" \
            --dir target/dist \
            --clobber

      - name: Checkout mcpp-index fork
        uses: actions/checkout@v7
        with:
          repository: ZheFeng7110/mcpp-index
          ref: main
          fetch-depth: 0
          path: mcpp-index
          token: ${{ secrets.BOOST_MODULE_PR_TO_MCPP_INDEX_GH_TOKEN }}

      - name: Update descriptor on a new branch
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          KEY="${TAG#v}"
          BRANCH="boost-module-${TAG}"
          SHA256="$(sha256sum target/dist/*.tar.xz | cut -d' ' -f1)"
          GLOBAL_URL="https://github.com/ZheFeng7110/boost-module/releases/download/${TAG}/boost-module-${TAG}.tar.xz"
          CN_URL="https://gitcode.com/ZheFeng7/boost-module/releases/download/${TAG}/boost-module-${TAG}.tar.xz"

          cd mcpp-index
          # Base the branch on current upstream main so the PR applies cleanly
          # even when the fork's main has drifted.
          git remote add upstream https://github.com/mcpplibs/mcpp-index.git
          git fetch --force upstream main
          git switch -c "$BRANCH" upstream/main

          python3 ../scripts/update_mcpp_index.py \
            --file pkgs/z/ZheFeng7110.boost.lua \
            --key "$KEY" \
            --global-url "$GLOBAL_URL" \
            --cn-url "$CN_URL" \
            --sha256 "$SHA256"

          git add pkgs/z/ZheFeng7110.boost.lua
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Zhefeng7110.boost: Add ${KEY}"
          # Force so a re-run can repair a stale branch left by an aborted run.
          git push --force origin "$BRANCH"

      - name: Open PR upstream
        env:
          GH_TOKEN: ${{ secrets.BOOST_MODULE_PR_TO_MCPP_INDEX_GH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          BRANCH="boost-module-${TAG}"
          KEY="${TAG#v}"
          BODY="$(cat <<EOF
          Register ZheFeng7110.boost ${KEY} (Boost modules wrapper) in the index.

          - Source: https://github.com/ZheFeng7110/boost-module/releases/tag/${TAG}
          - CN mirror: https://gitcode.com/ZheFeng7/boost-module/releases/tag/${TAG}
          - Descriptor: \`pkgs/z/ZheFeng7110.boost.lua\`, new version prepended

          Automated by the boost-module release workflow.
          EOF
          )"
          gh pr create \
            --repo mcpplibs/mcpp-index \
            --base main \
            --head "ZheFeng7110:${BRANCH}" \
            --title "Zhefeng7110.boost: Add ${KEY}" \
            --body "$BODY"
