# Verify the committed outputs of the repository's generation scripts.
# The three latest labels are the mainstream x86_64/arm64 hosted runners;
# no separate Linux/Windows ARM or macOS Intel legs are needed here.
name: Verify Generation Scripts

env:
  # Keep the export generator on the same LLVM release on every hosted runner.
  # The MinGW sysroot is GCC 16.1.0; runner-provided clang versions are not a
  # stable parser for that sysroot (notably __builtin_popcountg and mm_malloc.h).
  LLVM_VERSION: "23.1.3"
  LLVM_MAJOR: "23"

on:
  push:
    branches: [b1.91.0wdev]
    paths:
      - ".github/workflows/verify-scripts.yml"
      - "scripts/**"
      - "src/**"
      - "deps/boost/**"
      - "mcpp.toml"
      # Script `scripts/ci/verify_generated.py` depends on git, so we need to follow
      # .gitignore and .gitattributes to triggering workflow run.
      - ".gitignore"
      - ".gitattributes"
  pull_request:
    branches: [b1.91.0wdev]
    paths:
      - ".github/workflows/verify-scripts.yml"
      - "scripts/**"
      - "src/**"
      - "deps/boost/**"
      - "mcpp.toml"
      - ".gitignore"
      - ".gitattributes"

concurrency:
  group: generated-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      GITHUB_EVENT_BEFORE: ${{ github.event.before }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # import_boost is platform-independent and intentionally owned by
          # one leg, so an update does not trigger three large downloads.
          - os: ubuntu-latest
            check_import_boost: true
            llvm_archive: LLVM-23.1.3-Linux-X64.tar.xz
            llvm_sha256: ca9fe385a5d9e2d88132dc0e23a00e9f87f38fa75f67207b5e457d208e71d013
          - os: windows-latest
            check_import_boost: false
            llvm_archive: clang+llvm-23.1.3-x86_64-pc-windows-msvc.tar.xz
            llvm_sha256: 9ee6a2192fbb30c776415af529927f76ca6b5d1d55699bb1315f9878e610b5b8
          - os: macos-latest
            check_import_boost: false
            llvm_archive: LLVM-23.1.3-macOS-ARM64.tar.xz
            llvm_sha256: 3dcfd88aec10be204a24037bcb0dc0ad777882e9dbe8ac60e2639060d8a794b1

    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: scripts/uv.lock

      # The slim xlings compiler package omits libclang. Using its headers
      # with pip's libclang 18 corrupts the AST even though clang++ passes.
      # Install the full upstream release so the driver, C API and builtin
      # headers all come from LLVM 23, as used by the committed snapshots.
      # Keep the compressed archive and the extracted prefix in fixed homes:
      # `~/llvm/archive` and `~/llvm/dist`. `~` is not expanded by bash inside
      # double quotes (the previous job-level `LLVM_PATH: ~/llvm` therefore
      # failed the Unix existence checks), and the two trees need independent
      # caches: a failed extraction must not discard a verified archive.
      - name: Restore extracted LLVM
        id: llvm-dist
        uses: actions/cache/restore@v6
        with:
          path: ~/llvm/dist
          key: llvm-dist-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.LLVM_VERSION }}-${{ matrix.llvm_sha256 }}

      - name: Restore LLVM archive
        id: llvm-archive
        if: steps.llvm-dist.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/llvm/archive
          key: llvm-archive-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.LLVM_VERSION }}-${{ matrix.llvm_sha256 }}

      - name: Download LLVM ${{ env.LLVM_VERSION }} archive
        id: llvm-download
        if: steps.llvm-dist.outputs.cache-hit != 'true' && steps.llvm-archive.outputs.cache-hit != 'true'
        shell: bash
        env:
          LLVM_ARCHIVE: ${{ matrix.llvm_archive }}
          LLVM_SHA256: ${{ matrix.llvm_sha256 }}
        run: |
          set -euo pipefail
          # `$HOME` is the runner's home in Git Bash (`/c/Users/...`) and Unix.
          LLVM_ARCHIVES="$HOME/llvm/archive"
          ARCHIVE="$LLVM_ARCHIVES/$LLVM_ARCHIVE"
          mkdir -p "$LLVM_ARCHIVES"

          curl --fail --location --retry 3 \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/$LLVM_ARCHIVE" \
            --output "$ARCHIVE.part"

          # Native Python cannot open Git Bash's `/c/...` paths; hand it the
          # same file in native form instead of re-deriving `$HOME`.
          LLVM_ARCHIVE_FILE="$ARCHIVE.part"
          if [[ "${RUNNER_OS:-}" == Windows ]]; then
            LLVM_ARCHIVE_FILE="$(cygpath -w "$LLVM_ARCHIVE_FILE")"
          fi
          export LLVM_ARCHIVE_FILE

          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          with Path(os.environ["LLVM_ARCHIVE_FILE"]).open("rb") as f:
              digest = hashlib.file_digest(f, "sha256").hexdigest()
          if digest != os.environ["LLVM_SHA256"]:
              raise SystemExit("LLVM archive SHA-256 mismatch: " + digest)
          PY

          # Only promote a verified archive; a later cache hit can then trust it.
          mv "$ARCHIVE.part" "$ARCHIVE"

      # Persist the archive even if extraction fails below.
      - name: Save LLVM archive
        if: steps.llvm-download.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ~/llvm/archive
          key: ${{ steps.llvm-archive.outputs.cache-primary-key }}

      - name: Extract LLVM ${{ env.LLVM_VERSION }}
        if: steps.llvm-dist.outputs.cache-hit != 'true'
        shell: bash
        env:
          LLVM_ARCHIVE: ${{ matrix.llvm_archive }}
        run: |
          set -euo pipefail
          LLVM_PREFIX="$HOME/llvm/dist"
          ARCHIVE="$HOME/llvm/archive/$LLVM_ARCHIVE"
          test -f "$ARCHIVE"
          mkdir -p "$LLVM_PREFIX"
          # Read the archive through stdin: GNU tar on the Windows runner treats
          # a drive letter in `-f D:/...` as a remote host.
          tar -xJf - -C "$LLVM_PREFIX" --strip-components=1 < "$ARCHIVE"

      - name: Configure LLVM generator environment (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          LLVM_PREFIX="$HOME/llvm/dist"
          test -x "$LLVM_PREFIX/bin/clang++"
          test -f "$LLVM_PREFIX/lib/clang/$LLVM_MAJOR/include/mm_malloc.h"
          echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"
          # Export the resolved prefix: downstream Python reads `LLVM_PATH` and
          # does not expand `~`.
          echo "LLVM_PATH=$LLVM_PREFIX" >> "$GITHUB_ENV"
          echo "CXX=$LLVM_PREFIX/bin/clang++" >> "$GITHUB_ENV"
          echo "CLANG_RESOURCE_DIR=$LLVM_PREFIX/lib/clang/$LLVM_MAJOR/include" >> "$GITHUB_ENV"
          echo "CLANG_NO_DEFAULT_CONFIG=1" >> "$GITHUB_ENV"
          if [[ "$RUNNER_OS" == Linux ]]; then
            echo "LD_LIBRARY_PATH=$LLVM_PREFIX/lib:$LLVM_PREFIX/lib/x86_64-unknown-linux-gnu:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          fi
          "$LLVM_PREFIX/bin/clang++" --version
          "$LLVM_PREFIX/bin/clang++" -print-resource-dir || true

      - name: Configure LLVM generator environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvmPrefix = Join-Path $env:USERPROFILE "llvm\dist"
          $clangxx = Join-Path $llvmPrefix "bin\clang++.exe"
          $resource = Join-Path $llvmPrefix "lib\clang\$env:LLVM_MAJOR\include"
          if (-not (Test-Path $clangxx)) { throw "missing $clangxx" }
          if (-not (Test-Path (Join-Path $resource "mm_malloc.h"))) { throw "missing mm_malloc.h under $resource" }
          "$llvmPrefix\bin" >> $env:GITHUB_PATH
          # Native path so downstream Python's `LLVM_PATH` lookup works.
          "LLVM_PATH=$llvmPrefix" >> $env:GITHUB_ENV
          "CXX=$clangxx" >> $env:GITHUB_ENV
          "CLANG_RESOURCE_DIR=$resource" >> $env:GITHUB_ENV
          "CLANG_NO_DEFAULT_CONFIG=1" >> $env:GITHUB_ENV
          & $clangxx --version
          & $clangxx -print-resource-dir

      # Save after installation checks, even if later generation checks fail.
      # Exact keys only: never reuse another release's parser or headers.
      - name: Save extracted LLVM
        if: steps.llvm-dist.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/llvm/dist
          key: ${{ steps.llvm-dist.outputs.cache-primary-key }}

      # fetch_mingw_sysroot.py already verifies and reuses files in this
      # directory. Persist the compressed archive across fresh GitHub runners
      # so only the first run for each OS downloads it.
      - name: Cache MinGW sysroot archive
        uses: actions/cache@v6
        with:
          path: scripts/_deps/_archives
          key: mingw-sysroot-archive-${{ runner.os }}-${{ hashFiles('scripts/fetch_mingw_sysroot.py') }}
          restore-keys: |
            mingw-sysroot-archive-${{ runner.os }}-

      - name: Install script dependencies
        run: uv sync --project scripts --locked

      - name: Check AST parser and script regressions
        working-directory: scripts
        run: |
          uv run --locked python -c "import boost_common as bc; v = bc.libclang_version(); print('AST parser:', v); assert '${{ env.LLVM_VERSION }}' in v, v"
          uv run --locked python -m unittest discover -s tests

      - name: Verify generated scripts (including import_boost when changed)
        if: matrix.check_import_boost
        run: uv run --project scripts --locked python scripts/ci/verify_generated.py --import-boost-if-changed

      - name: Verify generated scripts
        if: ${{ !matrix.check_import_boost }}
        run: uv run --project scripts --locked python scripts/ci/verify_generated.py
