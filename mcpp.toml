# Boost 1.91.0 vendored + C++23 module layer — single repo (modeled after opencv-m).
#
#   deps/boost/              vendored Boost 1.91.0 (boost/ 汇总 include 根, scripts/import_boost.py)
#   src/*.cppm               module interfaces (GMF include → export module → export using)
#   src/gen_exports/*.inc    generated export using lists (committed, scripts/gen_exports.py)
#   include/boost-module/    bypass headers (macros.hpp — macro spelling for preprocessor users)
#   tests/**/*.cpp           per-library smoke tests (mcpp test)
#
# M3: 纯头库模块层 (19 库) — optional / variant / variant2 / any / core / container_hash /
# mp11 / static_string / scope / scope_exit / type_traits / algorithm / iterator / range /
# io / rational / endian / tuple / system.
# M4: 8 个编译库 (filesystem/regex/thread/chrono/program_options/stacktrace/json/url)
# 接入 — libs/*/src/*.cpp 进 sources, 模块 TU (头文件声明) ↔ 库 TU (定义) 链接一致。
# 设计详见 .agents/docs/2026-08-11-m4-compiled-libs.md;
# 重生成 .inc 后必跑 scripts/reapply_hand_edits.py 重放手编。
#
# M8 (mcpp features): 每库一个 [features.<lib>] — sources = 该库 .cppm + 编译 TU globs,
# implies = 模块 import 边 (src/gen_exports/*.deps)。默认集 = 18 库闭包 (计划 §3.2),
# 其余 9 库 opt-in。base [build].sources 保留全部 per-lib glob (feature 同字符串声明
# gating): build 模式 DROP 只编激活库; test 模式 DROP 跳过 → 27 库测试默认全绿。
# [features] 块与 [build].sources 由 scripts/gen_features.py 生成 (marker splice),
# 勿手改。汇总模块 src/boost.cppm 已删 — 由 build.mcpp 按激活 feature 动态生成
# (out_dir/boost.cppm, mcpp::source)。详见 .agents/docs/2026-08-15-m8-mcpp-features-infra.md。
#
# M11 (编译库批量接入): + 18 个 T2 模块 (atomic/charconv/cobalt/container/contract/
# date_time/graph/iostreams/log/math/nowide/process/random/serialization/test/timer/
# type_erasure/wave), 共 103 模块; exception 降级 include-only (gcc 16.1 模块 CMI
# pendings bug)。默认闭包 34 库。详见 .agents/docs/2026-08-30-m11-t2-compiled-libs.md。
#
# C1 (消费者使用方式重分类, 2026-09-06): describe/openmethod/scope_exit/log/test
# 降级 include-only (§1: 宏主体 API 或 gcc 缺陷族; log/test 为「编译库 include-only」
# 新形态 —— [features] 条目保留库 TU sources、无 .cppm 模块源; test 的 feature 改名
# unit_test_framework, 与上游 CMake 目标对齐, 双形态消费: feature 开 = 编译框架,
# 关 = <boost/test/included/**> 纯头聚合, 两形态不可同链接)。共 110 模块 + 2 个
# 无模块 feature = 112 feature。详见
# .agents/plan/2026-09-06-usage-reclassification-and-include-only-adjustment-plan.md。

[package]
namespace   = "boost"
name        = "boost"
version     = "b1.91.0w0.0.0"
description = "Boost 1.91.0 vendored + C++23 module layer — import boost.optional; (API spelling unchanged, no headers)"
license     = "BSL-1.0"
repo        = "https://github.com/ZheFeng7110/boost-module"

