# Boost 1.91.0 vendored + C++23 module layer — single repo (modeled after opencv-m).
#
#   deps/boost/              vendored Boost 1.91.0 (boost/ 汇总 include 根, scripts/import_boost.py)
#   src/*.cppm               module interfaces (GMF include → export module → export using)
#   src/gen_exports/*.inc    generated export using lists (committed, scripts/gen_exports.py)
#   include/boost-module/    bypass headers (macros.hpp — macro spelling for preprocessor users)
#   tests/**/*.cpp           per-library smoke tests (mcpp test)
#
# M3: 纯头库模块层 (19 库) — optional / variant / variant2 / any / core / container_hash /
# mp11 / static_string / scope / scope_exit / type_traits / algorithm / iterator / range /
# io / rational / endian / tuple / system.
# M4: 8 个编译库 (filesystem/regex/thread/chrono/program_options/stacktrace/json/url)
# 接入 — libs/*/src/*.cpp 进 sources, 模块 TU (头文件声明) ↔ 库 TU (定义) 链接一致。
# 设计详见 .agents/docs/2026-08-11-m4-compiled-libs.md;
# 重生成 .inc 后必跑 scripts/reapply_hand_edits.py 重放手编。
#
# M8 (mcpp features): 每库一个 [features.<lib>] — sources = 该库 .cppm + 编译 TU globs,
# implies = 模块 import 边 (src/gen_exports/*.deps)。默认集 = 18 库闭包 (计划 §3.2),
# 其余 9 库 opt-in。base [build].sources 保留全部 per-lib glob (feature 同字符串声明
# gating): build 模式 DROP 只编激活库; test 模式 DROP 跳过 → 27 库测试默认全绿。
# [features] 块与 [build].sources 由 scripts/gen_features.py 生成 (marker splice),
# 勿手改。汇总模块 src/boost.cppm 已删 — 由 build.mcpp 按激活 feature 动态生成
# (out_dir/boost.cppm, mcpp::source)。详见 .agents/docs/2026-08-15-m8-mcpp-features-infra.md。

[package]
namespace   = "boost"
name        = "boost"
version     = "b1.91.0w0.0.0"
description = "Boost 1.91.0 vendored + C++23 module layer — import boost.optional; (API spelling unchanged, no headers)"
license     = "BSL-1.0"
repo        = "https://github.com/ZheFeng7110/boost-module"

[build]
# ── <gen-sources> generated by scripts/gen_features.py — do not edit ──
sources = [
    "src/optional.cppm",
    "src/variant.cppm",
    "src/variant2.cppm",
    "src/any.cppm",
    "src/core.cppm",
    "src/container_hash.cppm",
    "src/mp11.cppm",
    "src/static_string.cppm",
    "src/scope.cppm",
    "src/scope_exit.cppm",
    "src/type_traits.cppm",
    "src/algorithm.cppm",
    "src/iterator.cppm",
    "src/range.cppm",
    "src/io.cppm",
    "src/rational.cppm",
    "src/endian.cppm",
    "src/tuple.cppm",
    "src/system.cppm",
    "src/boost_system_extras.cpp",
    "src/filesystem.cppm",
    "deps/boost/libs/filesystem/src/*.cpp",
    "src/regex.cppm",
    "deps/boost/libs/regex/src/*.cpp",
    "src/thread.cppm",
    "deps/boost/libs/thread/src/future.cpp",
    "deps/boost/libs/thread/src/win32/*.cpp",
    "deps/boost/libs/thread/src/pthread/once.cpp",
    "deps/boost/libs/thread/src/pthread/thread.cpp",
    "src/boost_thread_extras.cpp",
    "src/chrono.cppm",
    "deps/boost/libs/chrono/src/*.cpp",
    "src/program_options.cppm",
    "deps/boost/libs/program_options/src/*.cpp",
    "src/stacktrace.cppm",
    "deps/boost/libs/stacktrace/src/basic.cpp",
    "src/json.cppm",
    "deps/boost/libs/json/src/*.cpp",
    "src/url.cppm",
    "deps/boost/libs/url/src/**/*.cpp",
]
# ── </gen-sources> ──
include_dirs = [
    "include",
    "deps/boost",
]
# 模块 TU 与库 TU 宏一致 (opencv BMI 基线教训); -w 压 vendored 头告警噪音。
# filesystem 刻意不定义 BOOST_FILESYSTEM_SOURCE — 模块/库两侧保持 v3 API 一致 (M4 §5)。
# _MT: MSVC 风味 clang++ driver 不定义线程标志, boost config 靠它判 BOOST_HAS_THREADS
# (cl 模式本就有, 双端一致定义无害; 普通 msvc 链接时 _MT 对应多线程 CRT, mcpp 无 /MT 概念)。
# _WIN32_WINNT=0x0A00: mingw 风味不默认定义, boost.winapi 的 WaitOnAddress/
# WakeByAddress* 需 >= 0x0602 才声明 (thread_primitives.cpp 依赖); 生成器快照同值。
defines  = ["BOOST_ALL_NO_LIB", "_MT", "_WIN32_WINNT=0x0A00"]
cxxflags = ["-w"]
# M8: 原 M4 的 thread 私有标志 (BOOST_THREAD_BUILD_LIB) 已移入 [features.thread].flags
# (私有 per-TU, 不传播消费者) — 见下方生成块。

# ── <gen-features> generated by scripts/gen_features.py — do not edit ──
[features]
default = ["optional", "variant", "variant2", "any", "core", "mp11", "type_traits", "algorithm", "iterator", "range", "io", "tuple", "system", "filesystem", "regex", "thread", "chrono", "json"]
all = { implies = ["optional", "variant", "variant2", "any", "core", "container_hash", "mp11", "static_string", "scope", "scope_exit", "type_traits", "algorithm", "iterator", "range", "io", "rational", "endian", "tuple", "system", "filesystem", "regex", "thread", "chrono", "program_options", "stacktrace", "json", "url"] }
[features.optional]
  sources = ["src/optional.cppm"]
  implies = ["core", "type_traits"]
[features.variant]
  sources = ["src/variant.cppm"]
  implies = ["core", "type_traits"]
[features.variant2]
  sources = ["src/variant2.cppm"]
[features.any]
  sources = ["src/any.cppm"]
[features.core]
  sources = ["src/core.cppm"]
[features.container_hash]
  sources = ["src/container_hash.cppm"]
  implies = ["mp11"]
[features.mp11]
  sources = ["src/mp11.cppm"]
[features.static_string]
  sources = ["src/static_string.cppm"]
  implies = ["container_hash", "core"]
[features.scope]
  sources = ["src/scope.cppm"]
  implies = ["core"]
[features.scope_exit]
  sources = ["src/scope_exit.cppm"]
  implies = ["core", "type_traits"]
[features.type_traits]
  sources = ["src/type_traits.cppm"]
[features.algorithm]
  sources = ["src/algorithm.cppm"]
  implies = ["core", "iterator", "range", "tuple", "type_traits"]
[features.iterator]
  sources = ["src/iterator.cppm"]
  implies = ["core", "mp11", "optional", "type_traits"]
[features.range]
  sources = ["src/range.cppm"]
  implies = ["core", "iterator", "optional", "tuple", "type_traits"]
[features.io]
  sources = ["src/io.cppm"]
[features.rational]
  sources = ["src/rational.cppm"]
  implies = ["type_traits"]
[features.endian]
  sources = ["src/endian.cppm"]
[features.tuple]
  sources = ["src/tuple.cppm"]
  implies = ["core"]
[features.system]
  sources = ["src/system.cppm", "src/boost_system_extras.cpp"]
  implies = ["variant2"]
[features.filesystem]
  sources = ["src/filesystem.cppm", "deps/boost/libs/filesystem/src/*.cpp"]
  implies = ["system"]
[features.regex]
  sources = ["src/regex.cppm", "deps/boost/libs/regex/src/*.cpp"]
  implies = ["type_traits"]
[features.thread]
  sources = ["src/thread.cppm", "deps/boost/libs/thread/src/future.cpp", "deps/boost/libs/thread/src/win32/*.cpp", "deps/boost/libs/thread/src/pthread/once.cpp", "deps/boost/libs/thread/src/pthread/thread.cpp", "src/boost_thread_extras.cpp"]
  flags = [{ glob = "deps/boost/libs/thread/src/**", defines = ["BOOST_THREAD_BUILD_LIB"] }]
  implies = ["chrono", "core", "io", "optional", "system", "type_traits"]
[features.chrono]
  sources = ["src/chrono.cppm", "deps/boost/libs/chrono/src/*.cpp"]
  implies = ["system", "type_traits"]
[features.program_options]
  sources = ["src/program_options.cppm", "deps/boost/libs/program_options/src/*.cpp"]
  implies = ["any", "core", "iterator"]
[features.stacktrace]
  sources = ["src/stacktrace.cppm", "deps/boost/libs/stacktrace/src/basic.cpp"]
[features.json]
  sources = ["src/json.cppm", "deps/boost/libs/json/src/*.cpp"]
  implies = ["mp11", "system", "variant2"]
[features.url]
  sources = ["src/url.cppm", "deps/boost/libs/url/src/**/*.cpp"]
  implies = ["core", "optional", "system", "variant2"]
# ── </gen-features> ──

# M8: thread per-OS TU 互斥 — 全平台 glob 进 feature thread.sources, 这里用 `!`
# 排除异平台 (计划 §1.3/§3.1; M7 pthread 伞文件 once.cpp 不 glob once_atomic.cpp)。
[target.windows.build]
sources = ["!deps/boost/libs/thread/src/pthread/**"]

[target.unix.build]
sources = ["!deps/boost/libs/thread/src/win32/**"]
ldflags = ["-pthread"]

# M8: src/boost.cppm 已删 (汇总模块由 build.mcpp 生成到 generated/boost.cppm)。
# 显式声明 lib root — validate.cppm 的 "without conventional lib root" warning
# 检查默认约定 src/<package-tail>.cppm (= src/boost.cppm, 已不存在), 这里指向
# build.mcpp 在扫描前生成的固定文件, 消除 warning。generated/ 已 gitignore。
[lib]
path = "generated/boost.cppm"

[targets.boost]
kind = "lib"
