# ── </gen-features> ──

# M8: thread per-OS TU 互斥 — 全平台 glob 进 feature thread.sources, 这里用 `!`
# 排除异平台 (计划 §1.3/§3.1; M7 pthread 伞文件 once.cpp 不 glob once_atomic.cpp)。
# M11: log 同模式 — windows/posix 目录全平台 glob 进 feature, 这里互斥 (两平台
# 有同名符号 ipc_reliable_message_queue/object_name, 必须互斥)。
# M11: log 的 dump_avx2/dump_ssse3 在两个 target 都排除 — 顶部无条件 include
# <immintrin.h>/<tmmintrin.h> (arm64 macos CI 腿编译失败), 且其符号只在消费者
# 自定义 BOOST_LOG_USE_AVX2/SSSE3 时被引用 (模块面宏固定, 不可用 — M4 §9 限制)。
[target.windows.build]
# M11 CI 修复: _WIN32_WINNT 只属于 Windows 目标 (boost.winapi WaitOnAddress
# 需 >= 0x0602; POSIX 上见 [build].defines 处注释 — asio Windows-App 探测误触发)。
defines = ["_WIN32_WINNT=0x0A00"]
sources = [
    "!deps/boost/libs/thread/src/pthread/**",
    "!deps/boost/libs/log/src/posix/**",
    "!deps/boost/libs/log/src/dump_avx2.cpp",
    "!deps/boost/libs/log/src/dump_ssse3.cpp",
]
# M11: cobalt (asio socket) 与 process (ext/*: ntdll 进程信息 + shell32
# CommandLineToArgvW)、log object_name (secur32 GetUserNameExW)、atomic
# (synchronization WaitOnAddress) 的 windows 系统库依赖 — 镜像上游 CMake 的
# WIN32 链接集。clang++ 驱动把 -l<name> 映射为 <name>.lib。
ldflags = ["-lws2_32", "-lntdll", "-lshell32", "-ladvapi32", "-lsecur32", "-luser32", "-lsynchronization"]

[target.unix.build]
sources = [
    "!deps/boost/libs/thread/src/win32/**",
    "!deps/boost/libs/log/src/windows/**",
    "!deps/boost/libs/log/src/dump_avx2.cpp",
    "!deps/boost/libs/log/src/dump_ssse3.cpp",
]
ldflags = ["-pthread"]

# M8: src/boost.cppm 已删 (汇总模块由 build.mcpp 生成到 generated/boost.cppm)。
# 显式声明 lib root — validate.cppm 的 "without conventional lib root" warning
# 检查默认约定 src/<package-tail>.cppm (= src/boost.cppm, 已不存在), 这里指向
# build.mcpp 在扫描前生成的固定文件, 消除 warning。generated/ 已 gitignore。
[lib]
path = "generated/boost.cppm"

[targets.boost]
kind = "lib"
