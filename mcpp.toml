include_dirs = [
    "include",
    "deps/boost",
    # M11: log 的库 TU 以引号 include 私有头 ("windows/auto_handle.hpp" 等),
    # 上游 CMake 用 target_include_directories(... PRIVATE src) — 同源。
    "deps/boost/libs/log/src",
    # M11: atomic 的 lock_pool.cpp 用 #include BOOST_PP_ITERATE() 展开成裸文件名
    # "lock_pool_init1.ipp" — clang 按当前文件目录解析, gcc 不按, 需显式 -I src。
    "deps/boost/libs/atomic/src",
]
# 模块 TU 与库 TU 宏一致 (opencv BMI 基线教训); -w 压 vendored 头告警噪音。
# filesystem 刻意不定义 BOOST_FILESYSTEM_SOURCE — 模块/库两侧保持 v3 API 一致 (M4 §5)。
# _MT: MSVC 风味 clang++ driver 不定义线程标志, boost config 靠它判 BOOST_HAS_THREADS
# (cl 模式本就有, 双端一致定义无害; 普通 msvc 链接时 _MT 对应多线程 CRT, mcpp 无 /MT 概念)。
# _WIN32_WINNT=0x0A00: mingw 风味不默认定义, boost.winapi 的 WaitOnAddress/
# WakeByAddress* 需 >= 0x0602 才声明 (thread_primitives.cpp 依赖); 生成器快照同值。
# (M11 CI 修复: 移入 [target.windows.build] — POSIX 上该宏会让 asio 误入
# Windows-App 探测分支 (config.hpp _WIN32_WINNT>=0x0603 → winapifamily.h),
# cobalt/process 依赖扫描硬错; POSIX 的 winapi 模块面为空 (M9 守卫), 无需此宏。)
# WIN32_LEAN_AND_MEAN (M11): asio (cobalt/log/process) 在 windows.h 先拉入
# winsock1 时硬报 "WinSock.h has already been included" — 本宏让 windows.h 跳过
# winsock.h, asio 自行包含 winsock2.h; 全包统一 (模块 TU 与库 TU 宏一致, M4 §2a)。
# SECURITY_WIN32 (M11): log 的 windows TU include <security.h>, 其 sspi.h 链要求
# SECURITY_WIN32/KERNEL/MAC 三选一 (上游 CMakeLists.txt:324 同款, 只作用私有 TU)。
defines  = ["BOOST_ALL_NO_LIB", "_MT", "WIN32_LEAN_AND_MEAN", "SECURITY_WIN32"]
# M9: poly_collection's detail headers specialize std::is_void (the
# is_final/is_invocable fallback hooks); clang+MSVC STL hard-errors on it for
# plain #include consumers too, -Wno-invalid-specialization downgrades it to a
# suppressed warning. Applies to the vendored headers only.
cxxflags = ["-w", "-Wno-invalid-specialization"]
# M8: 原 M4 的 thread 私有标志 (BOOST_THREAD_BUILD_LIB) 已移入 [features.thread].flags
# (私有 per-TU, 不传播消费者) — 见下方生成块。

