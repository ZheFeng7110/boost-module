# ── </gen-sources> ──
include_dirs = [
    "include",
    "deps/boost",
]
# 模块 TU 与库 TU 宏一致 (opencv BMI 基线教训); -w 压 vendored 头告警噪音。
# filesystem 刻意不定义 BOOST_FILESYSTEM_SOURCE — 模块/库两侧保持 v3 API 一致 (M4 §5)。
# _MT: MSVC 风味 clang++ driver 不定义线程标志, boost config 靠它判 BOOST_HAS_THREADS
# (cl 模式本就有, 双端一致定义无害; 普通 msvc 链接时 _MT 对应多线程 CRT, mcpp 无 /MT 概念)。
# _WIN32_WINNT=0x0A00: mingw 风味不默认定义, boost.winapi 的 WaitOnAddress/
# WakeByAddress* 需 >= 0x0602 才声明 (thread_primitives.cpp 依赖); 生成器快照同值。
defines  = ["BOOST_ALL_NO_LIB", "_MT", "_WIN32_WINNT=0x0A00"]
# M9: poly_collection's detail headers specialize std::is_void (the
# is_final/is_invocable fallback hooks); clang+MSVC STL hard-errors on it for
# plain #include consumers too, -Wno-invalid-specialization downgrades it to a
# suppressed warning. Applies to the vendored headers only.
cxxflags = ["-w", "-Wno-invalid-specialization"]
# M8: 原 M4 的 thread 私有标志 (BOOST_THREAD_BUILD_LIB) 已移入 [features.thread].flags
# (私有 per-TU, 不传播消费者) — 见下方生成块。

